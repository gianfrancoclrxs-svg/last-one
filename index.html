<!DOCTYPE html>
<html lang="en">

<title>Last One Out</title>
<style>
  :root { --bg:#0a0a0f; --fg:#f2f2f6; --dim:#6c6c7a; --acc:#ffd23f; }
  * { box-sizing:border-box; margin:0; }

  body { height:100dvh; display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); overflow:hidden; }

  h1 { font-size:11px; letter-spacing:.4em; font-weight:600; color:var(--dim); text-transform:uppercase; }
  #count { font-size:40px; font-weight:800; line-height:1.05; font-variant-numeric:tabular-nums; }
  #count small { display:block; font-size:10px; letter-spacing:.3em; color:var(--dim); font-weight:500; text-transform:uppercase; }
  #stage { flex:none; }
  canvas { display:block; border-radius:14px; border:1px solid #1d1d27; background:#0e0e14; }
  #feed { flex:none; height:18px; font-size:13px; color:var(--dim); transition:opacity .4s; text-align:center; }
  footer { flex:none; display:flex; flex-wrap:wrap; justify-content:center; gap:8px; align-items:center; }
  select, button, input { font:inherit; }
  select, button { background:transparent; color:var(--fg); border:1px solid #33333f; border-radius:999px; padding:7px 14px; font-size:12px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--acc); }
  #hideBtn { position:fixed; top:10px; right:10px; z-index:5; }
  body.clean footer, body.clean h1 { display:none; }
  body.clean #hideBtn { opacity:0; }
  #w { width:56px; background:transparent; color:var(--fg); border:1px solid #33333f; border-radius:999px; padding:7px 10px; font-size:12px; text-align:center; }
  #q { flex:1 1 100%; max-width:320px; background:transparent; color:var(--fg); border:1px solid #33333f; border-radius:999px; padding:7px 14px; font-size:12px; }
  #key { flex:1 1 140px; max-width:220px; background:transparent; color:var(--fg); border:1px solid #33333f; border-radius:999px; padding:7px 14px; font-size:12px; }
  #vsbox { display:flex; align-items:center; gap:6px; color:var(--dim); font-size:12px; }
  #vsbox[hidden] { display:none; }
  #vsbox select { max-width:120px; }
  .fl { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); }
</style>
</head>
<body>
<button id="hideBtn" title="Hide or show settings (H)">Hide UI</button>
<header id="hd">
  <h1>Last One Out</h1>
  <div id="count">0%<small>leader progress</small></div>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<div id="feed"></div>
<footer id="ft">
  <input id="q" type="text" value="Can you guess who wins?" aria-label="Intro sentence">
  <select id="set"><option value="countries">Countries</option><option value="animals">Animals</option><option value="food">Food</option><option value="realclubs">Football clubs (live)</option><option value="monsters">Original monsters</option><option value="mine">My own images</option></select>

  <input id="key" type="password" placeholder="API-Sports key (optional)" autocomplete="off" hidden>
  <input type="file" id="files" accept="image/*" multiple hidden>
  <select id="md"><option value="first">First to finish</option><option value="last">Last to leave</option></select>
  <select id="ln"><option value="2">Short</option><option value="3">Medium</option><option value="6">Long</option></select>
  <select id="n">
    <option value="20">20 flags</option>
    <option value="50" selected>50 flags</option>
    <option value="100">100 flags</option>
    <option value="999">All</option>

</footer>

// one repeating block of the course; each repeat is mirrored and a bit faster
function course() {

  [[110, 4690], [200, 4690], [290, 4690], [65, 4745], [155, 4745], [245, 4745], [335, 4745]].forEach(a => bump(a[0], a[1], 12));

function build() {
  segs = []; pegs = []; bumps = []; mills = []; ports = []; kin = []; doors = []; OY = 0; MIR = false; SPD = 1;
  gateL = mk(0, GATEY, 200, GATEY, 8, "#8a8a99"); gateR = mk(200, GATEY, 400, GATEY, 8, "#8a8a99");

}

  if (b.kind === "emoji") {
    ctx.fillStyle = "#23232f"; ctx.fill(); ctx.font = `${r * 1.25}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.fillStyle = "#fff"; ctx.fillText(b.emoji, x, y + r * 0.06);
  } else if (b.kind === "cv") { ctx.clip(); ctx.drawImage(b.img, x - r, y - r, r * 2, r * 2); }
  else if (b.bad || !b.img || !b.img.complete || !b.img.naturalWidth) {
    ctx.fillStyle = "#22222c"; ctx.fill(); ctx.fillStyle = "#aaa"; ctx.font = `${r * .7}px system-ui`; ctx.fillText(b.short, x, y);
  } else if (b.fit === "contain") {
    ctx.fillStyle = b.bg || "#eeeef4"; ctx.fill(); ctx.clip();
    const iw = b.img.naturalWidth, ih = b.img.naturalHeight, k = (2 * r * 0.84) / Math.max(iw, ih);
    ctx.drawImage(b.img, x - iw * k / 2, y - ih * k / 2, iw * k, ih * k);

  ctx.restore();
}
function drawFinish() {
  ctx.save();
  for (let i = 0; i < 20; i++) for (let j = 0; j < 2; j++) { ctx.fillStyle = (i + j) % 2 ? "#f2f2f6" : "#15151d"; ctx.fillRect(i * 20, FIN + j * 10, 20, 10); }
  [[16, 1], [W - 16, -1]].forEach(([x, d]) => {
    ctx.strokeStyle = "#cfcfdc"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, FIN + 10); ctx.lineTo(x, FIN - 100); ctx.stroke();
    for (let c = 0; c < 5; c++) for (let r = 0; r < 3; r++) {
      ctx.fillStyle = (c + r) % 2 ? "#f2f2f6" : "#15151d";
      ctx.fillRect(x + d * (2 + c * 11) - (d < 0 ? 11 : 0), FIN - 100 + r * 11 + Math.sin(T * 5 + c * .9) * 3 * (c / 4), 11, 11);
    }
  });
  ctx.fillStyle = "#ffd23f"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = "800 22px system-ui";
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0.35em";
  ctx.fillText("FINISH", W / 2, FIN - 45); ctx.restore();
}
function ring(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283185); }
function draw() {
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, 0, 0); ctx.clearRect(0, 0, W, VH);
  ctx.save(); ctx.translate(0, -camY); ctx.lineCap = "round";
  const vis = (y, m) => y + m > camY && y - m < camY + VH;
  for (const s of segs) {
    if (s.x1 < -60 || (s.x1 === s.x2 && s.y1 === s.y2) || !vis((s.y1 + s.y2) / 2, Math.abs(s.y1 - s.y2) / 2 + s.th)) continue;
    ctx.strokeStyle = s.col; ctx.lineWidth = s.th; ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }
  ctx.fillStyle = "#1c1c26"; ctx.strokeStyle = "#ff4d8d"; ctx.lineWidth = 2;
  for (const k of kin) {
    const o = k.o, y = k.s.y1; if (!vis(y, 30)) continue;
    if (o.body) { const x = o.body === "L" ? -2 : 374; ctx.fillRect(x, y - 16, 28, 32); ctx.strokeRect(x, y - 16, 28, 32); }
    if (o.rod) { ctx.save(); ctx.globalAlpha = .5; ctx.lineWidth = 3; ctx.beginPath();
      if (o.rod === "R") { ctx.moveTo(k.s.x2, y); ctx.lineTo(W, y); } else { ctx.moveTo(0, y); ctx.lineTo(k.s.x1, y); } ctx.stroke(); ctx.restore(); }
  }
  drawFinish();
  ctx.fillStyle = "#6b6b7d"; for (const p of pegs) if (vis(p.y, 10)) { ring(p.x, p.y, p.r); ctx.fill(); }
  for (const p of bumps) {
    if (!vis(p.y, 40)) continue;
    ring(p.x, p.y, p.r); ctx.fillStyle = p.f > 0 ? "#2f7a4d" : "#10261a"; ctx.fill(); ctx.strokeStyle = "#5dff9a"; ctx.lineWidth = 3; ctx.stroke();
    ring(p.x, p.y, p.r * 0.35); ctx.fillStyle = "#5dff9a"; ctx.globalAlpha = .6; ctx.fill(); ctx.globalAlpha = 1;
  }
  for (const m of mills) if (vis(m.cy, 20)) { ring(m.cx, m.cy, 4 + m.L / 12); ctx.fillStyle = "#ffd23f"; ctx.fill(); }
  for (const p of ports) {
    if (!vis(p.y, 50)) continue;
    ctx.save(); ctx.translate(p.x, p.y); ctx.strokeStyle = p.col; ctx.fillStyle = p.col + "22"; ctx.lineWidth = (p.to ? 4 : 3) + p.f * 8;
    ring(0, 0, p.r); ctx.fill(); ctx.stroke(); ctx.setLineDash([5, 6]); ctx.lineWidth = 2; ctx.lineDashOffset = -T * 30 * (p.to ? 1 : -1);
    ring(0, 0, p.r - 9); ctx.stroke(); ctx.restore();
  }
  for (const b of balls) if (!b.gone && b.y > camY - 30 && b.y < camY + VH + 30) {
    drawBall(b, b.x, b.y, b.r);
    if (VS) { ctx.save(); ring(b.x, b.y, b.r + 3); ctx.lineWidth = 3; ctx.strokeStyle = b.side === 1 ? "#4dc9ff" : "#ff8a3d"; ctx.stroke(); ctx.restore(); }
  }
  for (const d of doors) {
    if (d.open || d.cyc || !vis(d.y, 60)) continue;
    ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(10,10,15,.88)"; ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 2; ctx.fillRect(W / 2 - 34, d.y + 10, 68, 46); ctx.strokeRect(W / 2 - 34, d.y + 10, 68, 46);
    ctx.fillStyle = "#ffd23f"; ctx.font = "800 28px system-ui"; ctx.fillText(d.need, W / 2, d.y + 29);
    ctx.fillStyle = "#8d8d9c"; ctx.font = "700 8px system-ui"; if ("letterSpacing" in ctx) ctx.letterSpacing = "0.15em"; ctx.fillText("TO OPEN", W / 2, d.y + 48); ctx.restore();
  }
  ctx.restore();
  if (over) {
    const e = ease(Math.min(1, wt / 0.9));
    ctx.fillStyle = `rgba(10,10,15,${0.85 * e})`; ctx.fillRect(0, 0, W, VH);
    for (const b of balls) {
      if (!b.win) continue;
      const x = b.sx + (b.tx - b.sx) * e, y = b.sy + (b.ty - b.sy) * e, r = b.sr + (b.tr - b.sr) * e;
      ctx.save(); ctx.globalAlpha = e; ring(x, y, r + 6); ctx.lineWidth = 4; ctx.strokeStyle = "#ffd23f";
      ctx.shadowColor = "rgba(255,210,63,.6)"; ctx.shadowBlur = 30; ctx.stroke(); ctx.restore();
      drawBall(b, x, y, r);
      if (NW > 1 && e > 0.4) { ctx.save(); ctx.globalAlpha = e; ctx.fillStyle = "#ffd23f"; ctx.font = "800 14px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "bottom"; ctx.fillText("#" + b.rank, x, y - r - 10); ctx.restore(); }
      if (e > 0.4) {
        ctx.save(); ctx.globalAlpha = Math.min(1, (e - 0.4) / 0.6); ctx.fillStyle = "#f2f2f6"; ctx.textAlign = "center"; ctx.textBaseline = "top";
        let fs = Math.max(10, Math.min(28, r * 0.32));
        do { ctx.font = `700 ${fs}px system-ui`; fs--; } while (ctx.measureText(b.name).width > b.cw && fs > 8);
        ctx.fillText(b.name, x, y + r + 12); ctx.restore();
      }
    }
    ctx.save(); ctx.globalAlpha = e; ctx.fillStyle = "#ffd23f"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "700 15px system-ui"; if ("letterSpacing" in ctx) ctx.letterSpacing = "0.4em";
    ctx.fillText(balls.filter(b => b.win).length > 1 ? "WINNERS" : "WINNER", W / 2, VH * 0.08); ctx.restore();
  } else if (mode !== "play") {
    const fade = mode === "intro" ? Math.max(0, Math.min(1, (INTRO - introT) / 0.5)) : 1;
    ctx.save(); ctx.globalAlpha = fade; ctx.fillStyle = "rgba(10,10,15,.66)"; ctx.fillRect(0, 0, W, VH);
    ctx.fillStyle = "#f2f2f6"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const fs = 32; ctx.font = `800 ${fs}px system-ui`;
    const lines = []; let cur = "";
    for (const w of introText().split(" ")) {
      const x = cur ? cur + " " + w : w;
      if (ctx.measureText(x).width > W * 0.82 && cur) { lines.push(cur); cur = w; } else cur = x;
    }
    lines.push(cur);
    lines.forEach((l, i) => ctx.fillText(l, W / 2, VH * 0.42 - (lines.length - 1) * fs * 0.6 + i * fs * 1.2));
    ctx.restore();
  }
}

function track(dtSim) {
  const live = balls.filter(b => !b.gone); if (!live.length) return;
  let ld = live[0]; for (const b of live) if (b.y > ld.y) ld = b;
  leadY = ld.y;
  for (const d of doors) {
    if (d.open || d.cyc) continue;
    let waiting = 0, lead = false;
    for (const b of live) { if (b.y > d.y - 85 && b.y < d.y + 20) waiting++; if (b.y > d.y - 45) lead = true; }
    d.need = Math.max(0, Math.min(GATE_NEED, live.length) - waiting);
    d.wait = lead ? d.wait + dtSim : 0;
    if (d.need === 0 || d.wait > 25) { d.open = true; setFeed("GATE OPEN!"); blip(); }
  }
  if (VS) top3 = live.slice().sort((a, b) => b.y - a.y);
  if (MODE === "first") {
    top3 = live.slice().sort((a, b) => b.y - a.y).slice(0, 3);
    const pct = Math.min(99, Math.floor(ld.y / FIN * 100));
    if (pct !== lastPct) { lastPct = pct; $("count").firstChild.nodeValue = pct + "%"; }
    if (ld !== lastLeader && performance.now() - lastLeadT > 1800 && ld.y > 400) { lastLeader = ld; lastLeadT = performance.now(); setFeed(ld.name + " leads!"); }
    const sl = ld.y > FIN - 450; if (sl && !slowFx) setFeed("FINAL STRETCH!"); slowFx = sl;
  } else {
    const sl = live.length <= NW + 2 && live.length < balls.length; if (sl && !slowFx) setFeed("LAST FLAGS!"); slowFx = sl;
  }
}
function camTarget() {
  const live = balls.filter(b => !b.gone); if (!live.length) return camY;
  const y = MODE === "first" ? leadY : live.map(b => b.y).sort((a, b) => a - b)[live.length >> 1];
  return Math.max(0, Math.min(H - VH, y - VH * 0.55));
}
function drawTop3() {
  ctx.save(); ctx.textAlign = "left"; ctx.textBaseline = "middle";
  top3.forEach((b, i) => {
    const y = 24 + i * 30;
    ctx.fillStyle = "rgba(10,10,15,.72)"; ctx.fillRect(8, y - 13, 80, 26);
    ctx.fillStyle = VS ? (b.side === 1 ? "#4dc9ff" : "#ff8a3d") : i ? "#cfcfdc" : "#ffd23f"; ctx.font = "800 11px system-ui"; ctx.fillText(VS ? "P" + b.side : i + 1, 14, y);
    drawBall(b, 40, y, 10);
    ctx.fillStyle = "#f2f2f6"; ctx.font = "700 11px system-ui"; ctx.fillText(b.short, 56, y);
  });
  ctx.restore();
}
function loop(now) {
  const dt = Math.min(0.033, (now - prev) / 1000); prev = now;
  if (over) wt += dt;
  else if (mode === "play") {
    const slow = slowFx ? 0.5 : 1, h = dt / 6 * slow;
    for (let i = 0; i < 6 * speed && !over; i++) { dyn(h); step(h); }
    if (!over) { track(dt * speed * slow); camY += (camTarget() - camY) * Math.min(1, dt * 4); }
  } else { dyn(dt); if (mode === "intro" && (introT += dt) > INTRO) mode = "play"; }
  draw(); if ((MODE === "first" || VS) && mode === "play" && !over) drawTop3();
  raf = requestAnimationFrame(loop);
}

$("set").onchange = () => { showKey(); if ($("set").value === "mine") $("files").click(); else start(); };
$("key").onchange = () => { CLUBS = null; };
$("files").onchange = () => {
  userItems = [...$("files").files].map(f => ({ name: f.name.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " "), kind: "img", url: URL.createObjectURL(f), fit: "contain", bg: "#eeeef4" }));
  start();
};
$("files").oncancel = () => { if (!userItems.length) $("set").value = "countries"; };
$("go").onclick = start; $("n").onchange = start; $("md").onchange = start; $("rg").onchange = start; $("fm").onchange = () => { applyFm(); start(); }; $("p1").onchange = start; $("p2").onchange = start; $("ln").onchange = start; $("w").onchange = start;
$("sp").onchange = () => speed = +$("sp").value;
$("hideBtn").onclick = () => { document.body.classList.toggle("clean"); size(); };
cv.onclick = () => { if (mode === "ready") begin(); else if (over) start(); };
$("m").onchange = () => { if (mode === "ready") return; if ($("m").checked) startMusic(); else stopMusic(); };
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const k = e.key.toLowerCase(); if (k === " ") { e.preventDefault(); cv.onclick(); } if (k === "h") $("hideBtn").click(); if (k === "r") start();
});
addEventListener("resize", size);
showKey(); applyFm();
start();
</script>
